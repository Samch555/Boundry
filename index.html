<!DOCTYPE html>
<html>
<head>
    <title>Cricket Boundary Overlay</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        /* Animated Boundary Icons */
        .boundary {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            opacity: 0;
            pointer-events: none;
        }
        
        #four {
            color: #00FF00; /* Green */
            animation: none;
        }
        
        #six {
            color: #FFD700; /* Gold */
            animation: none;
        }
        
        /* Animations */
        @keyframes bounceIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Boundary Overlays (Hidden by Default) -->
    <div id="four" class="boundary">4</div>
    <div id="six" class="boundary">6</div>

    <script>
        // CricClubs API URL (Replace with your match ID)
        const API_URL = "https://cricclubs.com/live/CricClubsLive.do?matchId=1100&clubId=3933";
        
        let lastRuns = 0;
        let lastWickets = 0;
        
        // Fetch CricClubs API every 5 seconds
        function fetchScore() {
            fetch(API_URL)
                .then(response => response.text()) // CricClubs returns HTML, not JSON
                .then(html => {
                    // Parse HTML to extract runs (example logic - adjust as needed)
                    const runsMatch = html.match(/Runs:\s*(\d+)/i);
                    const currentRuns = runsMatch ? parseInt(runsMatch[1]) : 0;
                    
                    // Check for boundary (4 or 6)
                    const runsDiff = currentRuns - lastRuns;
                    if (runsDiff === 4) showBoundary("four");
                    else if (runsDiff === 6) showBoundary("six");
                    
                    lastRuns = currentRuns;
                })
                .catch(error => console.error("Error fetching score:", error));
        }
        
        // Show animated boundary
        function showBoundary(type) {
            const element = document.getElementById(type);
            
            // Reset animation
            element.style.animation = 'none';
            void element.offsetHeight; // Trigger reflow
            
            // Play animation
            element.style.animation = 'bounceIn 0.8s forwards';
            
            // Hide after 3 seconds
            setTimeout(() => {
                element.style.animation = 'fadeOut 0.5s forwards';
            }, 3000);
        }
        
        // Poll API every 5 seconds
        setInterval(fetchScore, 5000);
    </script>
</body>
</html>
