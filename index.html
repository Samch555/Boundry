<!DOCTYPE html>
<html>
<head>
    <title>Cricket Event Detection</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .event-gif {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Event GIFs -->
    <div id="four-gif" class="event-gif">
        <img src="https://media.giphy.com/media/lz5ZtYCE84hlGrOFH2/giphy.gif" width="400" alt="Four">
    </div>
    
    <div id="six-gif" class="event-gif">
        <img src="https://media.giphy.com/media/iReASvDfSxQPXzvWpa/giphy.gif" width="400" alt="Six">
    </div>
    
    <div id="wicket-gif" class="event-gif">
        <img src="https://media.giphy.com/media/Ip015AvySprQDZpALZ/giphy.gif" width="400" alt="Wicket">
    </div>
    
    <!-- API Status -->
    <div id="status">Loading CricClubs data...</div>

    <script>
        // Configuration
        const API_URL = "https://cricclubs.com/live/CricClubsLive.do";
        const MATCH_ID = "1100"; // Replace with your match ID
        const CLUB_ID = "3933"; // Replace with your club ID
        const POLL_INTERVAL = 5000; // 5 seconds
        const GIF_DISPLAY_TIME = 3000; // 3 seconds
        
        let lastRuns = 0;
        let lastWickets = 0;
        
        // Show event animation
        function showEvent(type) {
            const element = document.getElementById(`${type}-gif`);
            
            // Reset animation
            element.style.animation = 'none';
            void element.offsetHeight;
            
            // Play animation
            element.style.animation = 'fadeIn 0.5s forwards';
            
            // Hide after display time
            setTimeout(() => {
                element.style.animation = 'fadeOut 0.5s forwards';
            }, GIF_DISPLAY_TIME);
            
            console.log(`Event detected: ${type.toUpperCase()}`);
            document.getElementById('status').textContent = `Event: ${type.toUpperCase()} detected`;
        }
        
        // Parse CricClubs HTML to extract match data
        function parseScorecard(html) {
            // ADAPT THESE REGEX PATTERNS TO MATCH YOUR API RESPONSE
            const runsMatch = html.match(/<span[^>]*>Runs<\/span>\s*:\s*<span[^>]*>(\d+)/i);
            const wicketsMatch = html.match(/<span[^>]*>Wickets<\/span>\s*:\s*<span[^>]*>(\d+)/i);
            
            return {
                runs: runsMatch ? parseInt(runsMatch[1]) : 0,
                wickets: wicketsMatch ? parseInt(wicketsMatch[1]) : 0
            };
        }
        
        // Check for match events
        function checkForEvents(currentRuns, currentWickets) {
            const runsDiff = currentRuns - lastRuns;
            const wicketsDiff = currentWickets - lastWickets;
            
            // Boundary detection
            if (runsDiff === 4) {
                showEvent('four');
            } else if (runsDiff === 6) {
                showEvent('six');
            }
            
            // Wicket detection
            if (wicketsDiff > 0) {
                showEvent('wicket');
            }
            
            lastRuns = currentRuns;
            lastWickets = currentWickets;
        }
        
        // Fetch data from CricClubs API
        function fetchScorecard() {
            const fullUrl = `${API_URL}?matchId=${MATCH_ID}&clubId=${CLUB_ID}`;
            
            // Use CORS proxy if needed (uncomment if getting CORS errors)
            // const proxyUrl = "https://cors-anywhere.herokuapp.com/";
            // fetch(proxyUrl + fullUrl)
            
            fetch(fullUrl)
                .then(response => response.text())
                .then(html => {
                    document.getElementById('status').textContent = "Live data loaded";
                    const { runs, wickets } = parseScorecard(html);
                    checkForEvents(runs, wickets);
                })
                .catch(error => {
                    console.error("API Error:", error);
                    document.getElementById('status').textContent = "Error loading data";
                });
        }
        
        // Start polling
        setInterval(fetchScorecard, POLL_INTERVAL);
        
        // Initial fetch
        fetchScorecard();
    </script>
</body>
</html>
