<!DOCTYPE html>
<html>
<head>
    <title>Four Animation</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #four-animation {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 120px; font-weight: bold; color: #00FF00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.7);
            opacity: 0; z-index: 1000; pointer-events: none;
            animation: none;
        }
        @keyframes fourBounce {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <div id="four-animation">4</div>
    <script>
        function showFour() {
            const four = document.getElementById('four-animation');
            four.style.animation = 'none';
            void four.offsetHeight;
            four.style.animation = 'fourBounce 1.2s forwards';
            setTimeout(() => four.style.opacity = '0', 3000);
        }
        // Test automatically
        window.onload = showFour;
    </script>
</body>
</html>
