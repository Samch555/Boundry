<!DOCTYPE html>
<html>
<head>
    <title>Cricket Boundary Detection</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }
        
        .event-gif {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* Hidden audio element */
        #applause-audio {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Event GIFs -->
    <div id="four-gif" class="event-gif">
        <img src="https://media.giphy.com/media/lz5ZtYCE84hlGrOFH2/giphy.gif" width="400" alt="">
    </div>
    <div id="six-gif" class="event-gif">
        <img src="https://media.giphy.com/media/iReASvDfSxQPXzvWpa/giphy.gif" width="400" alt="">
    </div>

    <!-- Audio Element -->
    <audio id="applause-audio" preload="auto">
        <source src="https://raw.githubusercontent.com/Samch555/Boundry/main/claps.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Configuration
        const API_URL = "https://cricclubs.com/live/CricClubsLive.do";
        const MATCH_ID = "641"; // Replace with your match ID
        const CLUB_ID = "38238"; // Replace with your club ID
        const POLL_INTERVAL = 5000; // 5 seconds
        const GIF_DISPLAY_TIME = 3000; // 3 seconds
        
        let lastRuns = 0;
        const applauseAudio = document.getElementById('applause-audio');

        // Show event and play audio for boundaries
        function showBoundary(type) {
            const element = document.getElementById(`${type}-gif`);
            
            // Reset animation
            element.style.animation = 'none';
            void element.offsetHeight;
            
            // Play animation
            element.style.animation = 'fadeIn 0.5s forwards';
            
            // Play audio (only for 4s and 6s)
            applauseAudio.currentTime = 0;
            applauseAudio.play().catch(e => console.log("Audio play failed:", e));
            
            setTimeout(() => element.style.animation = 'fadeOut 0.5s forwards', GIF_DISPLAY_TIME);
        }

        // Parse scorecard and detect boundaries
        function checkScorecard(html) {
            // ADAPT THIS TO MATCH YOUR CricClubs HTML STRUCTURE
            const runsMatch = html.match(/Runs<\/span>\s*:\s*<span[^>]*>(\d+)/i);
            const currentRuns = runsMatch ? parseInt(runsMatch[1]) : lastRuns;
            const runsDiff = currentRuns - lastRuns;
            
            if (runsDiff === 4) showBoundary('four');
            else if (runsDiff === 6) showBoundary('six');
            
            lastRuns = currentRuns;
        }

        // Fetch data from CricClubs
        function fetchScorecard() {
            fetch(`${API_URL}?matchId=${MATCH_ID}&clubId=${CLUB_ID}`)
                .then(response => response.text())
                .then(html => checkScorecard(html))
                .catch(() => {}); // Silent fail
        }

        // Start polling
        setInterval(fetchScorecard, POLL_INTERVAL);
        fetchScorecard(); // Initial fetch
    </script>
</body>
</html>
