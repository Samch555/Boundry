<!DOCTYPE html>
<html>
<head>
    <title>Four Animation</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }
        
        #four-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            color: #00FF00; /* Green color */
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.7);
            opacity: 0;
            pointer-events: none;
        }
        
        @keyframes fourBounce {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            40% { transform: translate(-50%, -50%) scale(0.9); }
            60% { transform: translate(-50%, -50%) scale(1.1); }
            80% { transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        @keyframes fourFadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="four-animation">4</div>

    <script>
        // Function to show the four animation
        function showFour() {
            const four = document.getElementById('four-animation');
            
            // Reset animation
            four.style.animation = 'none';
            void four.offsetHeight; // Trigger reflow
            
            // Play animation
            four.style.animation = 'fourBounce 1.2s forwards';
            
            // Hide after 3 seconds
            setTimeout(() => {
                four.style.animation = 'fourFadeOut 0.5s forwards';
            }, 3000);
        }
        
        // For testing: Uncomment to manually trigger
        // showFour();
        
        // For API integration: Call showFour() when a four is detected
        // setInterval(checkForFours, 5000); // Example API polling
    </script>
</body>
</html>
