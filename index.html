<!DOCTYPE html>
<html>
<head>
    <title>Animated Boundary Overlay</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .boundary {
            position: fixed;
            top: 50%;
            left: -200px;
            transform: translateY(-50%);
            font-size: 120px;
            font-weight: bold;
            color: #00FF00;
            text-shadow: 0 0 20px #00FF00, 0 0 40px #FFFFFF;
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
        }
        
        /* Left-to-right rolling animation with celebration effects */
        @keyframes rollCelebration {
            0% {
                opacity: 0;
                left: -200px;
                transform: translateY(-50%) rotate(-30deg) scale(0.5);
                text-shadow: 0 0 10px #00FF00;
            }
            20% {
                opacity: 1;
                transform: translateY(-50%) rotate(0deg) scale(1.2);
                text-shadow: 0 0 30px #00FF00, 0 0 60px #FFFFFF;
            }
            80% {
                opacity: 1;
                transform: translateY(-50%) rotate(10deg) scale(1.1);
                text-shadow: 0 0 30px #00FF00, 0 0 60px #FFFFFF;
            }
            100% {
                left: 100%;
                opacity: 0;
                transform: translateY(-50%) rotate(30deg) scale(0.5);
                text-shadow: 0 0 10px #00FF00;
            }
        }
        
        /* Celebration particles */
        .particle {
            position: fixed;
            background: #FFD700;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
        }
        
        /* Test controls */
        #test-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            z-index: 1001;
        }
        
        #test-controls button {
            margin: 5px;
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Animated Boundary -->
    <div id="boundary-4" class="boundary">4</div>
    
    <!-- Test Controls -->
    <div id="test-controls">
        <button onclick="triggerBoundary()">Test Boundary (4 Key)</button>
    </div>

    <script>
        // Configuration
        const ANIMATION_DURATION = 3000; // 3 seconds
        
        // Trigger boundary animation
        function triggerBoundary() {
            const boundary = document.getElementById('boundary-4');
            
            // Reset animation
            boundary.style.animation = 'none';
            void boundary.offsetHeight;
            
            // Start animation
            boundary.style.animation = `rollCelebration ${ANIMATION_DURATION}ms forwards`;
            
            // Create celebration particles
            createParticles();
        }
        
        // Create celebration particles
        function createParticles() {
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random properties
                const size = Math.random() * 10 + 5;
                const posX = Math.random() * window.innerWidth;
                const posY = Math.random() * window.innerHeight;
                const delay = Math.random() * 1000;
                const duration = Math.random() * 1000 + 500;
                
                // Apply styles
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}px`;
                particle.style.top = `${posY}px`;
                
                // Animate particle
                particle.style.animation = `
                    fadeParticle ${duration}ms ${delay}ms forwards
                `;
                
                document.body.appendChild(particle);
                
                // Remove particle after animation
                setTimeout(() => {
                    particle.remove();
                }, delay + duration);
            }
            
            // Add CSS for particles if not exists
            if (!document.getElementById('particle-styles')) {
                const style = document.createElement('style');
                style.id = 'particle-styles';
                style.textContent = `
                    @keyframes fadeParticle {
                        0% { opacity: 0; transform: scale(0); }
                        50% { opacity: 0.8; transform: scale(1); }
                        100% { opacity: 0; transform: scale(0); }
                    }
                `;
                document.head.appendChild(style);
            }
        }
        
        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.key === '4') triggerBoundary();
        });
    </script>
</body>
</html>
