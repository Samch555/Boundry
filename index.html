<!DOCTYPE html>
<html>
<head>
    <title>Cricket Overlay Tester</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .boundary-gif {
            position: fixed;
            top: 50%;
            width: 400px;
            height: 400px;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .wicket-gif {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Left-to-right animation for boundaries */
        @keyframes rollIn {
            0% { 
                opacity: 0;
                left: -400px;
                transform: translateY(-50%) rotate(-30deg);
            }
            70% {
                opacity: 1;
                transform: translateY(-50%) rotate(10deg);
            }
            100% {
                left: 100%;
                opacity: 0;
                transform: translateY(-50%) rotate(30deg);
            }
        }
        
        /* Center animation for wickets */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        #test-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            z-index: 1001;
        }
        
        #test-controls button {
            margin: 5px;
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        
        #audio-enabler {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1002;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #status {
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Boundary GIFs (will roll left-to-right) -->
    <div id="four-gif" class="boundary-gif">
        <img src="https://media.giphy.com/media/lz5ZtYCE84hlGrOFH2/giphy.gif" width="400" alt="Four">
    </div>
    <div id="six-gif" class="boundary-gif">
        <img src="https://media.giphy.com/media/iReASvDfSxQPXzvWpa/giphy.gif" width="400" alt="Six">
    </div>
    
    <!-- Wicket GIF (centered) -->
    <div id="wicket-gif" class="wicket-gif">
        <img src="https://media.giphy.com/media/Ip015AvySprQDZpALZ/giphy.gif" width="400" alt="Wicket">
    </div>

    <!-- Audio Element -->
    <audio id="applause-audio" preload="auto">
        <source src="https://raw.githubusercontent.com/Samch555/Boundry/main/claps.mp3" type="audio/mpeg">
    </audio>

    <!-- Audio Enable Button -->
    <button id="audio-enabler" onclick="enableAudio()">🔊 Enable Audio</button>

    <!-- Test Controls -->
    <div id="test-controls">
        <h3>MANUAL TEST CONTROLS</h3>
        <div>
            <button onclick="triggerEvent('four')">Test FOUR (4 Key)</button>
            <button onclick="triggerEvent('six')">Test SIX (6 Key)</button>
            <button onclick="triggerEvent('wicket')">Test WICKET (W Key)</button>
        </div>
        <div id="status">Press buttons or keyboard keys (4, 6, W)</div>
    </div>

    <script>
        // Configuration
        const BOUNDARY_DISPLAY_TIME = 4000; // 4 seconds (matches animation duration)
        const WICKET_DISPLAY_TIME = 3000; // 3 seconds
        let audioEnabled = false;
        const applauseAudio = document.getElementById('applause-audio');
        const statusElement = document.getElementById('status');

        // Enable audio (required for some browsers)
        function enableAudio() {
            applauseAudio.play()
                .then(() => {
                    audioEnabled = true;
                    document.getElementById('audio-enabler').style.display = 'none';
                    applauseAudio.pause();
                    applauseAudio.currentTime = 0;
                    updateStatus("Audio enabled! Test with buttons/keyboard");
                })
                .catch(e => {
                    updateStatus("Error: Click 'Enable Audio' first");
                    console.error("Audio error:", e);
                });
        }

        // Trigger events manually
        function triggerEvent(type) {
            const element = document.getElementById(`${type}-gif`);
            
            // Reset animation
            element.style.animation = 'none';
            void element.offsetHeight;
            
            if (type === 'wicket') {
                // Centered animation for wickets
                element.style.animation = 'fadeIn 0.5s forwards';
                
                // Hide after display time
                setTimeout(() => {
                    element.style.animation = 'fadeOut 0.5s forwards';
                }, WICKET_DISPLAY_TIME);
            } else {
                // Rolling animation for boundaries
                element.style.left = '-400px';
                element.style.transform = 'translateY(-50%)';
                element.style.animation = 'rollIn 4s forwards';
                
                // Play sound for boundaries only if audio is enabled
                if (audioEnabled) {
                    applauseAudio.currentTime = 0;
                    applauseAudio.play().catch(e => console.log("Audio play failed:", e));
                }
            }
            
            updateStatus(`Triggered: ${type.toUpperCase()}`);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '4') triggerEvent('four');
            if (e.key === '6') triggerEvent('six');
            if (e.key.toLowerCase() === 'w') triggerEvent('wicket');
        });

        // Status updates
        function updateStatus(message) {
            statusElement.textContent = message;
            setTimeout(() => {
                if (statusElement.textContent === message) {
                    statusElement.textContent = "Press buttons or keyboard keys (4, 6, W)";
                }
            }, 2000);
        }

        // Try auto-enabling audio on load
        window.onload = function() {
            applauseAudio.play()
                .then(() => {
                    audioEnabled = true;
                    document.getElementById('audio-enabler').style.display = 'none';
                    applauseAudio.pause();
                    applauseAudio.currentTime = 0;
                })
                .catch(() => {
                    document.getElementById('audio-enabler').style.display = 'block';
                });
        };
    </script>
</body>
</html>
